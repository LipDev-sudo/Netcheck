[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netcheck"
dynamic = ["version"]
description = "Diagnóstico de rede em linha de comando: DNS, conexão TCP e certificado TLS."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hamilton Felipe Soares da Silva" }]
keywords = ["rede", "dns", "tcp", "tls", "diagnóstico", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Repository = "https://github.com/LipDev-sudo/Netcheck"

[project.scripts]
netcheck = "netcheck:main"

[tool.setuptools]
py-modules = ["netcheck"]

[tool.setuptools.dynamic]
version = { attr = "netcheck.__version__" }

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
